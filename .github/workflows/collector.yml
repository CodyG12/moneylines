# Hosted odds collector (README: "Hosted collection"). Started every 30 minutes; the concurrency
# group keeps one run at a time with the next one queued, and each run polls every 5 minutes for
# up to 5h40m (scripts/actions_collector.sh), so GitHub's late or skipped cron starts don't leave gaps.
name: collector
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Restore state and print status; no collection, nothing pushed"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      RECONCILED_FLAG: .reconciled      # set by a run that scored results; triggers the backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-lock.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check only
        if: ${{ inputs.check_only }}
        run: |
          scripts/state_sync.sh pull-state
          scripts/state_sync.sh pull-results
          .venv/bin/python -W ignore -m nbamodel odds-status --days 1
          .venv/bin/python -W ignore -m nbamodel odds-next || true
      - name: Collect
        if: ${{ !inputs.check_only }}
        run: scripts/actions_collector.sh
      - name: Daily backup of the encrypted state
        if: ${{ !inputs.check_only && hashFiles('.reconciled') != '' }}
        run: git cat-file blob origin/state:state.tar.gz.enc > state.tar.gz.enc
      - if: ${{ !inputs.check_only && hashFiles('.reconciled') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: state-${{ github.run_id }}
          path: state.tar.gz.enc
          retention-days: 14
