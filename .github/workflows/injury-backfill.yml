# Backfill official NBA injury reports (2019-20 on) into data/injury_history.db, kept encrypted on
# the injury-history branch (scripts/state_sync.sh). Manual start; each run works for up to ~5h,
# saves its progress every 30 minutes, and starts the next run itself until the archive is complete.
# The reports are free PDFs (no API credits); requests are spaced one second apart.
name: injury-backfill
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First game date"
        default: "2019-10-22"
permissions:
  contents: write
  actions: write
concurrency:
  group: injury-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-lock.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Backfill
        run: |
          scripts/state_sync.sh pull-results >/dev/null
          scripts/state_sync.sh pull-history || echo "no injury-history branch yet: starting fresh"
          stop=$(( $(date +%s) + 18000 ))
          rc=10
          while [ "$rc" = 10 ] && [ "$(date +%s)" -lt "$stop" ]; do
            set +e
            .venv/bin/python -W ignore -m nbamodel injuries-backfill --start "${{ inputs.start }}" --max-seconds 1800
            rc=$?
            set -e
            scripts/state_sync.sh push-history >/dev/null
            [ "$rc" = 0 ] || [ "$rc" = 10 ] || exit "$rc"
          done
          if [ "$rc" = 10 ]; then
            gh workflow run injury-backfill -f start="${{ inputs.start }}"
            echo "not complete yet: started the next run"
          fi
